name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Install, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm audit gate: fails on any high or critical advisory not listed in
      # .audit-allowlist.json, and on any expired or stale allowlist entry.
      # It runs before `npm ci` so no dependency code (install scripts, tests)
      # runs before the audit; it audits package-lock.json and needs no
      # node_modules. Run with node directly, not `npm run`, so nothing in
      # node_modules/.bin can shadow the npm the script spawns.
      - name: Audit (npm audit, high and critical)
        run: node scripts/audit-check.mjs

      - name: Install (lockfile)
        run: npm ci

      # Never-exec guard (tenshi#20): fails if any file under src/ could reach
      # a process, remote-command, dynamic-loading or code-generation API, or
      # imports a module outside its allowlist. Needs acorn from node_modules.
      # npm test runs it too; this step names the failure.
      - name: Never-exec guard (static)
        run: node scripts/no-exec-guard.mjs

      # Real OpenSSH server for tests/sshd-fixture.test.js (#36): Ubuntu's own
      # signed openssh-server package, no third-party action or image. The
      # policy-rc.d guard keeps the package from starting the system sshd;
      # the test starts its own sshd as the runner user on 127.0.0.1 with
      # throwaway keys. The step fails if a system sshd is left listening.
      - name: OpenSSH server for the sshd fixture
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            printf '#!/bin/sh\nexit 101\n' | sudo tee /usr/sbin/policy-rc.d > /dev/null
            sudo chmod 755 /usr/sbin/policy-rc.d
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends openssh-server
            sudo rm -f /usr/sbin/policy-rc.d
          fi
          sudo systemctl disable --now ssh.socket ssh.service 2>/dev/null || true
          dpkg-query -W -f='openssh-server ${Version}\n' openssh-server
          if ss -ltnH | grep -q ':22 '; then echo 'a system sshd is listening on port 22' >&2; exit 1; fi

      # The SFTP fake for most tests, and the real sshd fixture, which is
      # required here (it fails instead of skipping when sshd is missing).
      - name: Unit tests (Vitest, SFTP fake and real sshd)
        env:
          TENSHI_MCP_REQUIRE_SSHD: '1'
        run: npm test
