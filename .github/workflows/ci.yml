name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Install, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm audit gate: fails on any high or critical advisory not listed in
      # .audit-allowlist.json, and on any expired or stale allowlist entry.
      # It runs before `npm ci` so no dependency code (install scripts, tests)
      # runs before the audit; it audits package-lock.json and needs no
      # node_modules. Run with node directly, not `npm run`, so nothing in
      # node_modules/.bin can shadow the npm the script spawns.
      - name: Audit (npm audit, high and critical)
        run: node scripts/audit-check.mjs

      - name: Install (lockfile)
        run: npm ci

      - name: Unit tests (Vitest, SSH mocked)
        run: npm test
